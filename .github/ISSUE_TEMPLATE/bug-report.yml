name: Bug report
description: Report a reproducible problem with setup or an interaction.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: What happened, and how can we reproduce it?
      description: Include expected behavior and the steps to reproduce. Do not include passwords or private data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device, and Node version
    validations:
      required: true
